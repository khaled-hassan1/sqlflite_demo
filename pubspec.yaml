name: sqlite_demo
description: "ملاحظاتي — local-first notes app."
publish_to: 'none'

# Build number must stay above the last Play release (was 4).
version: 2.0.0+5

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  open_filex: ^4.7.0
  flutter_staggered_grid_view: ^0.7.0
  archive: ^4.3.0
  image_picker_android: ^0.8.13+23
  image_picker_platform_interface: ^2.11.1
  url_launcher: ^6.3.3
  # Only used to read notes saved by version 1.x (sqflite.db) once.
  sqflite: ^2.4.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo.jpg
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
